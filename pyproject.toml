[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zombieports"
version = "0.1.0"
description = "A TUI of every port listening on your machine: which project started it, how long it has been running, and one key to kill the zombies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "psutil>=5.9", "textual>=0.80"]
keywords = ["ports", "dev-server", "tui", "kill-port", "localhost", "lsof", "netstat", "developer-tools", "textual", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
zombieports = "zombieports.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/zombieports"
Issues = "https://github.com/ArkaKhorchidian/zombieports/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zombieports"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
